<script>
setTimeout(function(){
  var out=[],worst=0;
  document.querySelectorAll('.work-card, .product-card, .cart-item__name, .pp-name').forEach(function(el){
    var ov = el.scrollWidth - el.clientWidth;
    if(ov>1) out.push(el.className+' overflows by '+ov+'px');
    if(ov>worst) worst=ov;
  });
  // also check every element for horizontal document overflow
  var docOv = document.documentElement.scrollWidth - document.documentElement.clientWidth;
  var d=document.createElement('pre');d.id='O';
  d.textContent='OSTART\nCARDOVF:'+out.length+'\n'+out.join('\n')+'\nDOCOVF:'+docOv+'\nOEND';
  document.body.appendChild(d);
},3000);
</script>
